name: Build SPUTNIK Community for Windows

on:
  push:
    branches: [main]
    paths:
      - "SPUTNIK_Community.zip.b64"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _src/desktop/package-lock.json
      - name: Decode and unpack project
        shell: pwsh
        run: |
          $encoded = (Get-Content -Raw SPUTNIK_Community.zip.b64).Trim()
          [IO.File]::WriteAllBytes("$PWD/SPUTNIK_Community.zip", [Convert]::FromBase64String($encoded))
          Expand-Archive -Path SPUTNIK_Community.zip -DestinationPath _src -Force
      - name: Install dependencies
        working-directory: _src/desktop
        run: npm install
      - name: Build installer and portable EXE
        working-directory: _src/desktop
        env:
          VITE_API_URL: ${{ vars.SPUTNIK_API_URL }}
        run: npm run dist:win
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: SPUTNIK-Community-Windows-x64
          path: _src/desktop/release/*
          if-no-files-found: error
