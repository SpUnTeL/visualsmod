name: Build SPUTNIK Community for Windows

on:
  push:
    branches: [main]
    paths:
      - "SPUTNIK_Community.zip"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unpack project source
        shell: pwsh
        run: Expand-Archive -Path SPUTNIK_Community.zip -DestinationPath . -Force
      - name: Install dependencies
        working-directory: SPUTNIK_Community/desktop
        run: npm install
      - name: Build installer and portable EXE
        working-directory: SPUTNIK_Community/desktop
        env:
          VITE_API_URL: ${{ vars.SPUTNIK_API_URL }}
        run: npm run dist:win
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: SPUTNIK-Community-Windows-x64
          path: SPUTNIK_Community/desktop/release/*
          if-no-files-found: error
